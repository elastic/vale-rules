extends: existence
message: "Use caution when using first-person pronouns (I, me, my, mine)."
link: https://www.elastic.co/docs/contribute-docs/style-guide/grammar-spelling#use-singular-first-person-pronouns-sparingly-i-me-my-mine
ignorecase: true
level: suggestion
nonword: true
raw:
  - '(?:^|[^a-zA-Z0-9-])(me|my|mine)(?:[^a-zA-Z0-9-]|$)'
