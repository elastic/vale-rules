StylesPath = styles
MinAlertLevel = suggestion

# Keep code out of SkippedScopes. Vale 3.20+ treats it as an inline element and lints fenced code blocks.
SkippedScopes = script, style, pre
IgnoredScopes = tt, code, strong, b

Vocab = ElasticTerms, ThirdPartyProducts, TechJargon, GeographicNames

[*.md]
BasedOnStyles = Elastic
Elastic.Spelling = NO
# Ignore HTML comments and applies_to option metadata so rule matches come from rendered prose.
BlockIgnores = (?s)<!--.*?-->, (?m)^[ \t]*:applies_to:[ \t]*\{.*\}[ \t]*$
# Ignore common Markdown, MyST, and inline HTML constructs that often contain code-like tokens.
# The [anchor] pattern must not start with \s*. That consumed the newline after a fence line and
# broke fences whose first line is a bracket token, such as [Service] or [DEBUG] log lines.
TokenIgnores = % (.*), \*\*(.*), (.*)\*\*, \*\*(.*)\*\*, , <(.*)>, {{(.*)}}, \[[a-zA-Z0-9_.-]+\]
